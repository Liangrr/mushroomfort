html/head_include="<script>(()=>{const Native=window.AudioContext||window.webkitAudioContext;if(!Native)return;const contexts=new Set();const Wrapped=new Proxy(Native,{construct(target,args){const context=Reflect.construct(target,args);contexts.add(context);window.__protosAudioContexts=contexts;if(navigator.userActivation?.hasBeenActive&&context.state==='suspended')void context.resume();return context}});window.AudioContext=Wrapped;if(window.webkitAudioContext===Native)window.webkitAudioContext=Wrapped;const unlock=()=>{for(const context of contexts)if(context.state==='suspended')void context.resume()};for(const type of ['pointerdown','touchstart','keydown'])window.addEventListener(type,unlock,{capture:true,passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden)unlock()});window.__protosAudioUnlock=unlock;window.__protosAudioStates=()=>[...contexts].map(context=>context.state)})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
